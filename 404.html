<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>404</title>
  <style>
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #660000, #990000, #b30000, #330000);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(0,0,0,0.5);
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 6em;
      margin: 0;
      animation: bounce 1.5s infinite;
    }

    h2 {
      font-size: 1.8em;
      margin: 20px 0;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    a.button {
      background: #b30000;
      color: #fff;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 25px;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    a.button:hover {
      background: #800000;
      transform: scale(1.05);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Sahifa topilmadi</h2>
    <p>Kechirasiz, siz qidirgan sahifa mavjud emas yoki o‘chirib yuborilgan.</p>
    <a href="https://niso.unicorner.uz" class="button">Bosh sahifaga qaytish</a>
  </div>
</body>
</html>
